<!-- ======================================================== -->
  <!-- FLOATING NAVIGATION DOCK (Smart Nav: Auto-Hide / Reveal)  -->
  <!-- ======================================================== -->
  <header id="mainNavHeader" class="sticky top-3 sm:top-5 z-40 w-full px-3 sm:px-6 pointer-events-none transition-transform duration-300 ease-in-out">
    <div id="navDockContainer"
      class="max-w-5xl mx-auto flex items-center justify-between gap-3 bg-[#F4F5F0] border border-[#DDE2D9] shadow-[0_8px_30px_rgba(38,55,70,0.07)] rounded-full sm:rounded-2xl px-3.5 sm:px-6 py-2.5 sm:py-3 pointer-events-auto transition-all">

      <!-- Brand Logotype & Monogram (Smooth scroll to absolute top) -->
      <a href="#hero" onclick="window.scrollTo({top: 0, behavior: 'smooth'}); return false;" class="flex items-center gap-2.5 sm:gap-3 group min-w-0" aria-label="Jothilingam S - Home">
        <div class="relative shrink-0">
          <img src="/static/images/sj.png" alt="SJ Monogram Logo"
            class="w-9 h-9 sm:w-10 sm:h-10 rounded-full object-contain p-0.5 border border-[#DDE2D9] bg-white group-hover:border-[#496D65] transition-all"
            onerror="this.src='/static/images/Jothi.png'" />
        </div>
        <div class="flex flex-col min-w-0">
          <span
            class="font-sans font-bold text-xs sm:text-sm tracking-wider sm:tracking-widest uppercase text-[#263746] group-hover:text-[#496D65] transition-colors truncate">
            JOTHILINGAM S
          </span>
          <span
            class="font-mono text-[8px] sm:text-[9px] font-medium tracking-wider text-[#89918A] uppercase truncate hidden sm:block">
            ARCHITECTURAL &amp; CLOUD
          </span>
        </div>
      </a>

      <!-- Desktop Navigation Links with Active Indicator -->
      <nav class="hidden lg:flex items-center gap-1.5 lg:gap-2 text-xs font-medium tracking-wider uppercase"
        aria-label="Main Navigation">
        <a href="#about"
          class="nav-dock-link text-[#5F6C65] hover:text-[#263746] px-3 py-1.5 rounded-full transition-all flex items-center gap-1.5 focus-visible:ring-2 focus-visible:ring-[#496D65]"
          data-section="about">
          <span class="nav-dot w-1.5 h-1.5 rounded-full bg-[#C1A66B] hidden"></span>
          <span>About</span>
        </a>
        <a href="#skills"
          class="nav-dock-link text-[#5F6C65] hover:text-[#263746] px-3 py-1.5 rounded-full transition-all flex items-center gap-1.5 focus-visible:ring-2 focus-visible:ring-[#496D65]"
          data-section="skills">
          <span class="nav-dot w-1.5 h-1.5 rounded-full bg-[#C1A66B] hidden"></span>
          <span>Capabilities</span>
        </a>
        <a href="#projects"
          class="nav-dock-link text-[#5F6C65] hover:text-[#263746] px-3 py-1.5 rounded-full transition-all flex items-center gap-1.5 focus-visible:ring-2 focus-visible:ring-[#496D65]"
          data-section="projects">
          <span class="nav-dot w-1.5 h-1.5 rounded-full bg-[#C1A66B] hidden"></span>
          <span>Selected Works</span>
        </a>
        <a href="#journey"
          class="nav-dock-link text-[#5F6C65] hover:text-[#263746] px-3 py-1.5 rounded-full transition-all flex items-center gap-1.5 focus-visible:ring-2 focus-visible:ring-[#496D65]"
          data-section="journey">
          <span class="nav-dot w-1.5 h-1.5 rounded-full bg-[#C1A66B] hidden"></span>
          <span>Journey</span>
        </a>
        <a href="#contact"
          class="nav-dock-link text-[#5F6C65] hover:text-[#263746] px-3 py-1.5 rounded-full transition-all flex items-center gap-1.5 focus-visible:ring-2 focus-visible:ring-[#496D65]"
          data-section="contact">
          <span class="nav-dot w-1.5 h-1.5 rounded-full bg-[#C1A66B] hidden"></span>
          <span>Contact</span>
        </a>
      </nav>

      <!-- Right CTAs: GitHub & Primary Action -->
      <div class="flex items-center gap-2 sm:gap-3">
        <a href="https://github.com/JOTHILINGAM-S-CYBROX" target="_blank" rel="noopener noreferrer"
          class="p-2 text-[#5F6C65] hover:text-[#263746] hover:bg-[#E3EAE3] rounded-full transition-colors hidden sm:flex items-center justify-center"
          title="GitHub Profile" aria-label="GitHub Profile">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4">
            </path>
            <path d="M9 18c-4.51 2-5-2-7-2"></path>
          </svg>
        </a>

        <a href="#contact"
          class="hidden sm:inline-flex items-center gap-2 bg-[#496D65] hover:bg-[#3D5C55] text-white text-xs font-semibold px-4 py-2 rounded-full transition-colors shadow-xs">
          <span>Get in Touch</span>
          <svg class="w-3.5 h-3.5 text-[#C1A66B]" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="7" y1="17" x2="17" y2="7"></line>
            <polyline points="7 7 17 7 17 17"></polyline>
          </svg>
        </a>

        <!-- Mobile Menu Trigger -->
        <button id="menuBtn" type="button"
          class="lg:hidden p-2 text-[#263746] hover:bg-[#E3EAE3] rounded-full transition-colors focus:outline-none"
          aria-label="Open Mobile Menu" aria-expanded="false" aria-controls="mobileDrawer">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" x2="20" y1="12" y2="12"></line>
            <line x1="4" x2="20" y1="6" y2="6"></line>
            <line x1="4" x2="20" y1="18" y2="18"></line>
          </svg>
        </button>
      </div>

    </div>

    <!-- Mobile Navigation Drawer -->
    <div id="mobileDrawerBackdrop"
      class="fixed inset-0 bg-[#263746]/60 backdrop-blur-xs z-40 hidden opacity-0 transition-opacity duration-300 pointer-events-none"
      onclick="toggleMobileDrawer(false)">
    </div>

    <div id="mobileDrawer"
      class="fixed top-20 left-3 right-3 sm:left-6 sm:right-6 max-w-lg mx-auto bg-[#F4F5F0] border border-[#DDE2D9] rounded-2xl shadow-2xl p-5 z-50 hidden opacity-0 transform -translate-y-4 transition-all duration-300 pointer-events-none flex flex-col gap-4">

      <div class="flex items-center justify-between pb-3 border-b border-[#DDE2D9]">
        <span class="font-mono text-xs font-bold uppercase tracking-widest text-[#496D65]">Navigation Index</span>
        <button type="button" onclick="toggleMobileDrawer(false)"
          class="p-1 rounded-full text-[#5F6C65] hover:text-[#263746] hover:bg-[#E3EAE3]">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18"></path>
            <path d="m6 6 12 12"></path>
          </svg>
        </button>
      </div>

      <nav class="flex flex-col gap-1 text-sm font-medium" aria-label="Mobile Navigation">
        <a href="#about"
          class="mobile-nav-link flex items-center justify-between p-2.5 rounded-lg text-[#5F6C65] hover:text-[#263746] hover:bg-[#E3EAE3] transition-colors"
          data-section="about"
          onclick="toggleMobileDrawer(false)">
          <span>About</span>
          <span class="font-mono text-[10px] text-[#89918A]">01 →</span>
        </a>
        <a href="#skills"
          class="mobile-nav-link flex items-center justify-between p-2.5 rounded-lg text-[#5F6C65] hover:text-[#263746] hover:bg-[#E3EAE3] transition-colors"
          data-section="skills"
          onclick="toggleMobileDrawer(false)">
          <span>Capabilities</span>
          <span class="font-mono text-[10px] text-[#89918A]">02 →</span>
        </a>
        <a href="#projects"
          class="mobile-nav-link flex items-center justify-between p-2.5 rounded-lg text-[#5F6C65] hover:text-[#263746] hover:bg-[#E3EAE3] transition-colors"
          data-section="projects"
          onclick="toggleMobileDrawer(false)">
          <span>Selected Works</span>
          <span class="font-mono text-[10px] text-[#89918A]">03 →</span>
        </a>
        <a href="#journey"
          class="mobile-nav-link flex items-center justify-between p-2.5 rounded-lg text-[#5F6C65] hover:text-[#263746] hover:bg-[#E3EAE3] transition-colors"
          data-section="journey"
          onclick="toggleMobileDrawer(false)">
          <span>Journey</span>
          <span class="font-mono text-[10px] text-[#89918A]">04 →</span>
        </a>
        <a href="#contact"
          class="flex items-center justify-between p-2.5 rounded-lg bg-[#496D65] text-white hover:bg-[#3D5C55] transition-colors mt-2"
          data-section="contact"
          onclick="toggleMobileDrawer(false)">
          <span class="text-white">Get in Touch</span>
          <span class="font-mono text-[10px] text-[#C1A66B]">05 →</span>
        </a>
      </nav>

      <div class="pt-3 border-t border-[#DDE2D9] flex items-center justify-between text-xs text-[#5F6C65]">
        <a href="https://github.com/JOTHILINGAM-S-CYBROX" target="_blank" rel="noopener noreferrer"
          class="flex items-center gap-2 hover:text-[#263746] transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4">
            </path>
            <path d="M9 18c-4.51 2-5-2-7-2"></path>
          </svg>
          <span class="font-mono text-[11px] font-semibold">GitHub</span>
        </a>
        <span class="font-mono text-[10px] text-[#89918A]">COIMBATORE, IN</span>
      </div>

    </div>
  </header>
